# Push a tag like v0.1.1 to build, sign and publish a release. The installed app finds it through
# releases/latest/download/latest.json, so releases must be published (not drafts or prereleases).
# Run it by hand (workflow_dispatch) for a test build: the same signed AppImage, kept as a workflow
# artifact and never published, so installed copies don't see it.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    # The oldest supported Ubuntu, so the AppImage runs on Zorin OS 17 (Ubuntu 22.04) and newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but tauri.conf.json says $version"; exit 1; }
          grep -q "^version = \"$version\"" src-tauri/Cargo.toml || { echo "Cargo.toml version differs from $version"; exit 1; }
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust tests
        run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: UI check
        # Headless Chrome's virtual clock makes about 1 run in 20 fail on thumbnail timing; a real failure fails both runs.
        run: node ui-check.cjs || node ui-check.cjs
        env:
          CHROMIUM: google-chrome
      - uses: tauri-apps/tauri-action@v0
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --bundles appimage
          tagName: ${{ github.ref_name }}
          releaseName: Shoot Studio __VERSION__
          releaseBody: See CHANGELOG.md for what changed.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
      - name: Test build
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx --yes @tauri-apps/cli@2
          args: --bundles appimage
      - name: Keep the test build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: src-tauri/target/release/bundle/appimage/*.AppImage*
          retention-days: 7
