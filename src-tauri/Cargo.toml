[package]
name = "shoot-studio"
version = "0.3.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rawler = "0.8.0"
half = "2"
rayon = "1.12"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tauri-plugin-updater = "2"
